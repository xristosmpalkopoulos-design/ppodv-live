<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENGAGE CONTROL</title>
</head>

<body style="background:#111;color:#fff;text-align:center;font-family:Arial;padding-top:50px;">

<h1>🎙️ ΚΕΝΤΡΟ ΕΠΙΧΕΙΡΗΣΕΩΝ</h1>

<button id="start" style="font-size:24px;padding:15px 30px;">
🎙️ ΕΝΑΡΞΗ ΜΕΤΑΔΟΣΗΣ
</button>

<br><br>

<button id="stop" style="font-size:24px;padding:15px 30px;">
⏹️ ΔΙΑΚΟΠΗ
</button>

<h2 id="status">🔴 OFF AIR</h2>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const startBtn = document.getElementById('start');
const stopBtn = document.getElementById('stop');
const status = document.getElementById('status');

startBtn.addEventListener('click', () => {
    socket.emit('start-broadcast');
});

stopBtn.addEventListener('click', () => {
    socket.emit('stop-broadcast');
});

socket.on('status', (state) => {

    if(state){
        status.innerHTML = '🟢 ON AIR';
    } else {
        status.innerHTML = '🔴 OFF AIR';
    }

});
</script>

</body>
</html>
